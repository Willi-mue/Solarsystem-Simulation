[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsystem"
version = "0.3.0"
description = "Real-time solar system simulation with PyQt5"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Willi Müller" }]
requires-python = ">=3.10"
dependencies = ["PyQt5>=5.15", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.gui-scripts]
solarsystem = "solarsystem.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solarsystem = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/solarsystem/bodies.py" = ["E501"]  # Datentabellen bleiben einzeilig lesbar
